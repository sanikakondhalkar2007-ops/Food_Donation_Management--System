{% extends "base.html" %}

{% block title %}
Login
{% endblock %}

{% block content %}

<div class="form-box">

    <h1>Login</h1>

    <form method="POST">

        <label>Email</label>

        <input type="email"
               name="email"
               placeholder="Enter your email"
               required>


        <label>Password</label>

        <input type="password"
               name="password"
               placeholder="Enter your password"
               required>


        <button type="submit">
            Login
        </button>

    </form>


    <p>
        Don't have an account?

        <a href="{{ url_for('register') }}">
            Register
        </a>
    </p>

</div>


<div class="admin-info">

    <h3>Admin Login</h3>

    <p>Email: admin@gmail.com</p>

    <p>Password: admin123</p>

</div>

{% endblock %}
